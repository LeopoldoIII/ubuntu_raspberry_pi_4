version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devlab
      POSTGRES_USER: devlab
      POSTGRES_PASSWORD: devlab_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlab -d devlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass devlab_redis_password

  adminer:
    image: adminer:latest
    container_name: devlab-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: devlab_postgres_data
  redis_data:
    name: devlab_redis_data
