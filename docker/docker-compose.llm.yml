version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: devlab-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 2G

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: devlab-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=devlab-secret-key-change-me
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama

volumes:
  ollama_data:
    name: devlab_ollama_data
  open-webui_data:
    name: devlab_open_webui_data
