version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    container_name: devlab-dashy-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dashy-config.yml:/app/public/conf.yml
    environment:
      - NODE_ENV=production

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: devlab-beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro

  beszel:
    image: henrygd/beszel:latest
    container_name: devlab-beszel-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - beszel_data:/var/lib/beszel

  portainer:
    image: portainer/portainer-ce:latest
    container_name: devlab-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  beszel_data:
    name: devlab_beszel_data
  portainer_data:
    name: devlab_portainer_data
