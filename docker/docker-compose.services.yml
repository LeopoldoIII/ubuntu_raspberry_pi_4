version: '3.8'

services:
  samba:
    image: dperson/samba
    container_name: devlab-samba
    restart: unless-stopped
    ports:
      - "139:139"
      - "445:445"
    environment:
      - TZ=UTC
    volumes:
      - samba_share:/mnt/share
    command: -u "devlab;devlab_samba_pass" -s "sambashare;/mnt/share;yes;no;no;devlab"

volumes:
  samba_share:
    name: devlab_samba_share
