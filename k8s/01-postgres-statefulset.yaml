apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: devlab
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "devlab"
            - name: POSTGRES_USER
              value: "devlab"
            - name: POSTGRES_PASSWORD
              value: "devlab_k8s_password"
          volumeMounts:
            - name: postgres-persistent-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: devlab
spec:
  clusterIP: None # Headless service for StatefulSet
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
