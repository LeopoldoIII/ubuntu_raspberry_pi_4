apiVersion: v1
kind: ServiceAccount
metadata:
  name: devlab-read-only-sa
  namespace: devlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: devlab
  name: pod-reader-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-binding
  namespace: devlab
subjects:
- kind: ServiceAccount
  name: devlab-read-only-sa
  namespace: devlab
roleRef:
  kind: Role
  name: pod-reader-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-db-policy
  namespace: devlab
spec:
  podSelector:
    matchLabels:
      app: postgres-db
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend-api
    ports:
    - protocol: TCP
      port: 5432
