apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-deployment
  namespace: devlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci
  template:
    metadata:
      labels:
        app: floci
    spec:
      containers:
      - name: floci
        image: flociio/floci:latest
        ports:
        - containerPort: 4566
---
apiVersion: v1
kind: Service
metadata:
  name: floci-service
  namespace: devlab
spec:
  type: ClusterIP
  selector:
    app: floci
  ports:
  - port: 4566
    targetPort: 4566
