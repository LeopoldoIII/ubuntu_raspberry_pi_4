apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-deployment
  namespace: devlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-api
      role: frontend-api
  template:
    metadata:
      labels:
        app: sample-api
        role: frontend-api
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-service
  namespace: devlab
spec:
  type: NodePort
  selector:
    app: sample-api
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
